services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: <image name>:${VERSION:-latest}
    container_name: my-stuffs
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iwt.entrypoints=websecure"
      - "traefik.http.routers.iwt.tls=true"
      - "traefik.http.routers.<router name>.rule=Host(`<host>`) && PathPrefix(`/<path prefix>`)"
    networks:
      - default

networks:
  default:
    external: true
    name: ldwsolutions
